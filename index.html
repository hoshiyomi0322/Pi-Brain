<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pi-Brain</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    
    <script>
        // MathJax configuration
        window.MathJax = {
            loader: {
                load: ['[tex]/extarrows', '[tex]/mathtools', '[tex]/ams']
            },
            tex: {
                packages: {'[+]': ['extarrows', 'mathtools', 'ams']},
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                pageReady: function () {
                    return MathJax.startup.defaultPageReady().then(function () {
                        
                        if (window.triggerMathJax) {
                            window.triggerMathJax();
                        }
                    });
                }
            }
        };
    </script>
    <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name: 'Pi-Brain',
            auto2top: true,
            maxLevel: 3,
            relativePath: true, 
            
            
            plugins: [
                function(hook, vm) {
                    
                    window.triggerMathJax = function() {
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            var target = document.querySelector('#main');
                            if (target) {
                                MathJax.typesetPromise([target]).catch(function(err) {});
                            }
                        }
                    };

                    
                    // Adjust image paths for relative links
                    hook.doneEach(function() {
                        
                        var images = document.querySelectorAll('#main img');
                        images.forEach(function(img) {
                            var src = img.getAttribute('src');
                            if (src && !/^(http|https|\/)/.test(src)) {
                                var currentFile = vm.route.file; 
                                if (currentFile) {
                                    var folder = currentFile.substring(0, currentFile.lastIndexOf('/'));
                                    if (folder) {
                                        img.setAttribute('src', folder + '/' + src);
                                    }
                                }
                            }
                        });

                        
                        window.triggerMathJax();
                        
                        setTimeout(window.triggerMathJax, 200);
                    });
                }
            ]
        }
    </script>
    
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
