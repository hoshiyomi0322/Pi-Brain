<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="keywords" content="notes,it,programming,math,physics,chemistry,engineering,computer science,technology,science,education">
    <meta name="description" content="Pi-Brain is a personal knowledge management system that allows you to organize and manage your notes, documents, and other information in a structured and efficient way. It is designed to help you capture, organize, and retrieve information quickly and easily.">

    <title>Pi-Brain</title>
    
    <link rel="icon" type="image/png" href="./web/icon-64.png">
    <link rel="manifest" href="./web/manifest.json">
    <link rel="stylesheet" href="./web/blue.css">

    <script>
        <!-- MathJax configuration -->
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                processEscapes: true,
                macros: {
                    oiint: ['\\unicode{x222F}'],
                    oiiint: ['\\unicode{x2230}']
                }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
        };
    </script>
    <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name: 'Pi-Brain',
            homepage: 'index.md',
            auto2top: true,
            maxLevel: 1,
            relativePath: true,
            
            <!-- LaTeX configuration for Docsify -->
            latex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                customOptions: {
                    throwOnError: false,
                }
            },
        
            
            plugins: [
                function(hook, vm) {
                    hook.doneEach(function() {
                    
                        <!-- Set the document title based on the current file -->
                        var name = '';
                        if (vm.route.file) {
                            var rawName = vm.route.file.split('/').pop().replace('.md', '');
                            var spacedName = rawName.replace(/-/g, ' ');
                        
                            name = spacedName.replace(/\b\w/g, function(char) {
                                return char.toUpperCase();
                            });
                            document.title = 'Pi-Brain：' + name;
                        }
                    
                        <!-- Update the sidebar name subtitle based on the current file -->
                        var appNameContainer = document.querySelector('.app-name');
                        if (appNameContainer) {                       
                            var oldSubTitle = document.querySelector('.app-name-subtitle');
                            if (oldSubTitle) {
                                oldSubTitle.remove();
                            }
                            <!-- Only add the subtitle if the current file is not index.md or readme.md -->
                            var currentFile = vm.route.file.toLowerCase();
                            if (name && currentFile !== 'index.md' && currentFile !== 'readme.md') {
                                var subTitleElement = document.createElement('div');
                                subTitleElement.className = 'app-name-subtitle';
                                subTitleElement.style.fontSize = '0.70em';
                                subTitleElement.style.fontWeight = 'normal';
                                subTitleElement.style.color = 'rgba(255, 255, 255, 0.5)';
                                subTitleElement.style.marginTop = '1px';
                                subTitleElement.style.textTransform = 'none';
                                subTitleElement.textContent = name;
                                appNameContainer.appendChild(subTitleElement);
                            }
                        }
                    
                        <!-- Adjust image paths to be relative to the current file's directory -->
                        var images = document.querySelectorAll('#main img');
                        images.forEach(function(img) {
                            var src = img.getAttribute('src');
                            if (src && !/^(http|https|\/)/.test(src)) {
                                var currentFile = vm.route.file; 
                                if (currentFile) {
                                    var folder = currentFile.substring(0, currentFile.lastIndexOf('/'));
                                    if (folder) {
                                        img.setAttribute('src', folder + '/' + src);
                                    }
                                }
                            }
                        });
                    
                        <!-- Adjust links to other markdown files to be relative to the current file's directory -->
                        var currentFile = vm.route.file;
                        if (currentFile) {
                            var links = document.querySelectorAll('#main a[href*=".md"]');
                            var folder = currentFile.substring(0, currentFile.lastIndexOf('/'));
                        
                            links.forEach(function(a) {
                                var href = a.getAttribute('href');
                                if (/^(http|https|\/#\/|\/)/.test(href)) return;
                                var parts = href.split('#');
                                var relativePath = parts[0];
                                var anchor = parts[1];
                                var targetPath = (folder ? folder + '/' : '') + relativePath;
                                var pathSegments = targetPath.split('/');
                                var resolvedSegments = [];
                                for (var i = 0; i < pathSegments.length; i++) {
                                    var segment = pathSegments[i];
                                    if (segment === '..') {
                                        resolvedSegments.pop();
                                    } else if (segment !== '.' && segment !== '') {
                                        resolvedSegments.push(segment);
                                    }
                                }
                                var finalPath = resolvedSegments.join('/').replace(/\.md$/, '');
                                var newHref = '#/' + finalPath;
                                if (anchor) {
                                    newHref += '?id=' + anchor;
                                }
                                a.setAttribute('href', newHref);
                            });
                        }
                        
                        setTimeout(function () {
                            if (
                                window.piHeadingSearch &&
                                typeof window.piHeadingSearch.cleanSidebar === 'function'
                            ) {
                                window.piHeadingSearch.cleanSidebar();
                            }
                        }, 0);
                    });
                }
            ]
        }
    </script>
    <script>
        <!-- Heading search functionality -->
        (function () {
            const headingSearch = {
                index: [],
                initialized: false,
                loading: false,
                target: null,
                createUI: function () {
                    if (document.querySelector('.pi-heading-search')) {
                        return;
                    }
                
                    const sidebar = document.querySelector('.sidebar');
                
                    if (!sidebar) {
                        console.warn(
                            'Pi-Brain heading search: sidebar not found.'
                        );
                        return;
                    }
                
                    const container = document.createElement('div');
                
                    container.className = 'pi-heading-search';
                
                    container.innerHTML = `
                        <div class="pi-heading-search-title">
                            ☄️ Search
                        </div>
                    
                        <div class="pi-heading-search-input-wrapper">
                            <input
                                type="text"
                                class="pi-heading-search-input"
                                placeholder="Type to search..."
                                autocomplete="off"
                                spellcheck="false"
                            >
                        
                            <button
                                type="button"
                                class="pi-heading-search-clear"
                                aria-label="Clear search"
                            >×</button>
                        </div>
                    
                        <div class="pi-heading-search-results"></div>
                    `;
        
                    sidebar.appendChild(container);
        
                    const input = container.querySelector(
                        '.pi-heading-search-input'
                    );
        
                    const clearButton = container.querySelector(
                        '.pi-heading-search-clear'
                    );
        
                    input.addEventListener('input', function () {
                        headingSearch.search(this.value);
                    });
        
                    clearButton.addEventListener('click', function () {
                        input.value = '';
        
                        headingSearch.search('');
        
                        input.focus();
                    });
        
                    input.addEventListener('keydown', function (event) {
                        if (event.key === 'Escape') {
                            input.value = '';
        
                            headingSearch.search('');
        
                            input.blur();
                        }
                    });
        
                    this.initialized = true;
                },
                getMarkdownFiles: async function () {
                    const apiUrl =
                        'https://api.github.com/repos/hoshiyomi0322/Pi-Brain/git/trees/main?recursive=1';

                    try {
                        const response = await fetch(apiUrl);
                    
                        if (!response.ok) {
                            console.warn(
                                'Pi-Brain heading search: GitHub API request failed',
                                response.status
                            );
                        
                            return [];
                        }
                    
                        const data = await response.json();
                    
                        if (!data.tree) {
                            return [];
                        }
                    
                        const files = data.tree
                            .filter(function (item) {
                                return (
                                    item.type === 'blob' &&
                                    item.path.toLowerCase().endsWith('.md')
                                );
                            })
                            .map(function (item) {
                                return item.path;
                            });
                        
                        console.log(
                            'Pi-Brain heading search files:',
                            files
                        );
                        
                        return files;
                    } catch (error) {
                        console.warn(
                            'Pi-Brain heading search: unable to get GitHub files',
                            error
                        );
                    
                        return [];
                    }
                },
                buildIndex: async function () {
                    if (this.loading) {
                        return;
                    }
                    this.loading = true;
                    const files = await this.getMarkdownFiles();
                    console.log(
                        'Pi-Brain heading search: found',
                        files.length,
                        'Markdown files'
                    );
                    const results = [];
                    const batchSize = 8;
        
                    for (
                        let start = 0;
                        start < files.length;
                        start += batchSize
                    ) {
                        const batch = files.slice(
                            start,
                            start + batchSize
                        );
                        const batchResults = await Promise.all(
                            batch.map(async function (file) {
                                try {
                                    const rawUrl =
                                        'https://raw.githubusercontent.com/hoshiyomi0322/Pi-Brain/main/' +
                                        file;
                                    const response = await fetch(
                                        rawUrl,
                                        {
                                            cache: 'force-cache'
                                        }
                                    );
                                    if (!response.ok) {
                                        return [];
                                    }
                                    const markdown = await response.text();
                                    return headingSearch.parseMarkdown(
                                        markdown,
                                        file
                                    );
                                } catch (error) {
                                    console.warn(
                                        'Pi-Brain heading search:',
                                        file,
                                        error
                                    );
                                    return [];
                                }
                            })
                        );
                        batchResults.forEach(function (items) {
                            results.push(...items);
                        });
                    }
                    this.index = results;
                    this.loading = false;
                    try {
                        sessionStorage.setItem(
                            'pi-brain-heading-index',
                            JSON.stringify(this.index)
                        );
                    } catch (error) {
                        console.warn(
                            'Unable to cache heading index.'
                        );
                    }
                },           
                cleanHeadingText: function (text) {
                    let result = String(text);
                    result = result.replace(
                        /\[([^\]]+)\]\([^)]+\)/g,
                        '$1'
                    );
                    result = result.replace(
                        /\(\s*\$[\s\S]*?\$\s*\)/g,
                        ''
                    );
                    result = result.replace(
                        /\$\$[\s\S]*?\$\$/g,
                        ''
                    );
                    result = result.replace(
                        /\$[^$\r\n]*\$/g,
                        ''
                    );
                    result = result.split(/[：:]/)[0];
                    result = result.replace(
                        /<[^>]*>/g,
                        ''
                    );
                    result = result
                        .replace(/\*\*(.*?)\*\*/g, '$1')
                        .replace(/__(.*?)__/g, '$1')
                        .replace(/\*(.*?)\*/g, '$1')
                        .replace(/_(.*?)_/g, '$1')
                        .replace(/`(.*?)`/g, '$1');
                    result = result.replace(
                        /\(\s*\)/g,
                        ''
                    );
                    return result
                        .replace(/\s+/g, ' ')
                        .trim();
                },
                cleanSidebar: function () {
                    document
                        .querySelectorAll('.sidebar-nav li a')
                        .forEach(function (link) {
                            const originalText = link.textContent;
                            const cleanedText =
                                headingSearch.cleanHeadingText(
                                    originalText
                                );
                            if (cleanedText !== originalText) {
                                link.textContent = cleanedText;
                            }
                        });
                },
                
                parseMarkdown: function (markdown, file) {
                    const results = [];
                    markdown = markdown.replace(
                        /```[\s\S]*?```/g,
                        ''
                    );
                    markdown = markdown.replace(
                        /~~~[\s\S]*?~~~/g,
                        ''
                    );
                    markdown = markdown
                        .replace(/<li\b[^>]*>/gi, '\n')
                        .replace(/<\/li>/gi, '\n')
                        .replace(/<[^>]+>/g, ' ');

                    const lines = markdown.split(/\r?\n/);

                    lines.forEach(function (line) {
                        let cleanedLine = line
                            .replace(
                                /^\s*[-*+]\s+/,
                                ''
                            )
                            .trim();
                        const match = cleanedLine.match(
                            /^#{1,3}\s+(.+?)\s*$/
                        );
                    
                        if (!match) {
                            return;
                        }
                        const level = cleanedLine.match(
                            /^(#{1,3})/
                        )[1].length;
                        const originalTitle = match[1]
                            .replace(/\s+#+\s*$/g, '')
                            .trim();
                    
                        if (!originalTitle) {
                            return;
                        }
                        if (/\bexample\b/i.test(originalTitle)) {
                            return;
                        }
                        const displayTitle =
                            headingSearch.cleanHeadingText(
                                originalTitle
                            );
                        if (!displayTitle) {
                            return;
                        }
                        results.push({
                            file: file,
                            title: originalTitle,
                            displayTitle: displayTitle,
                            level: level,
                            searchText: (
                                displayTitle + ' ' + file
                            ).toLowerCase()
                        });
                    });
                    return results;
                },

                search: function (keyword) {
                    const resultsContainer =
                        document.querySelector(
                            '.pi-heading-search-results'
                        );
        
                    if (!resultsContainer) {
                        return;
                    }
        
                    keyword = keyword.trim().toLowerCase();
        
                    if (!keyword) {
                        resultsContainer.innerHTML = '';
                        return;
                    }
        
                    const results = this.index.filter(
                        function (item) {
                            return item.searchText.includes(keyword);
                        }
                    );
                    const visibleResults = results.slice(0, 100);
        
                    if (visibleResults.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="pi-heading-search-empty">
                                No results found
                            </div>
                        `;
        
                        return;
                    }
                    resultsContainer.innerHTML =
                        visibleResults.map(function (item) {
                            const fileName = item.file
                                .split('/')
                                .pop()
                                .replace(/\.md$/i, '');
                            return `
                                <a href="#"
                                    class="pi-heading-search-result level-${item.level}"
                                    data-file="${headingSearch.escapeAttribute(item.file)}"
                                    data-title="${headingSearch.escapeAttribute(item.title)}"
                                >
                                    <span class="pi-heading-result-text">
                                        ${headingSearch.escapeHTML(item.displayTitle)}
                                    </span>
                                    <span class="pi-heading-file">
                                        ${headingSearch.escapeHTML(fileName)}
                                    </span>
                                </a>
                            `;
                            
                        }).join('');
                    resultsContainer
                        .querySelectorAll(
                            '.pi-heading-search-result'
                        )
                        .forEach(function (link) {
                            link.addEventListener(
                                'click',
                                function (event) {
                                    event.preventDefault();
        
                                    const file = this.dataset.file;
                                    const title = this.dataset.title;
        
                                    headingSearch.target = {
                                        file: file,
                                        title: title
                                    };
        
                                    const route = file.replace(
                                        /\.md$/i,
                                        ''
                                    );
                                    const headingId =
                                        headingSearch.createHeadingId(title);
                                    window.location.hash =
                                        '#/' +
                                        route +
                                        '?id=' +
                                        encodeURIComponent(headingId);
                                }
                            );
                        });
                        if (
                            window.MathJax &&
                            typeof window.MathJax.typesetPromise === 'function'
                        ) {
                            window.MathJax.typesetPromise([
                                resultsContainer
                            ]).catch(function (error) {
                                console.warn(
                                    'Pi-Brain heading search MathJax:',
                                    error
                                );
                            });
                        }
                },          
                
                scrollToTarget: function () {
                    if (!this.target) {
                        return;
                    }
                    const target = this.target;
                    let attempts = 0;
                    function findHeading() {
                        const headings = document.querySelectorAll(
                            '#main h1, #main h2, #main h3'
                        );
                        let found = null;
                        headings.forEach(function (heading) {
                            if (found) {
                                return;
                            }
                            const title =
                                headingSearch.cleanHeadingText(
                                    heading.textContent
                                );
                            if (
                                title === headingSearch.cleanHeadingText(
                                    target.title
                                )
                            ) {
                                found = heading;
                            }
                        });
                        if (found) {
                            found.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                            found.classList.add(
                                'pi-heading-search-highlight'
                            );
                            setTimeout(function () {
                                found.classList.remove(
                                    'pi-heading-search-highlight'
                                );
                            
                            }, 1500);
                            headingSearch.target = null;
                            return;
                        }
                        attempts++;
                        if (attempts < 20) {
                            setTimeout(
                                findHeading,
                                100
                            );
                        } else {
                            headingSearch.target = null;
                        }
                    }
                    findHeading();
                },

                createHeadingId: function (title) {
                    return String(title)
                        .trim()
                        .toLowerCase()
                        .replace(
                            /[^\w\u00C0-\uFFFF\s-]/g,
                            ''
                        )
                        .replace(/\s+/g, '-')
                        .replace(/-+/g, '-');
                },

                escapeHTML: function (value) {
                    return String(value)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                },
        
                escapeAttribute: function (value) {
                    return this.escapeHTML(value);
                },
            
                init: async function () {
                    const self = this;
                    function waitForSidebar() {
                        return new Promise(function (resolve) {
                            const existingSidebar =
                                document.querySelector('.sidebar');
    
                            if (existingSidebar) {
                                resolve();
                                return;
                            }
                            const observer =
                                new MutationObserver(function () {
                                    const sidebar =
                                        document.querySelector('.sidebar');
    
                                    if (sidebar) {
                                        observer.disconnect();
                                        resolve();
                                    }
                                });
    
                            observer.observe(
                                document.body,
                                {
                                    childList: true,
                                    subtree: true
                                }
                            );
                        });
                    }
                    await waitForSidebar();
                    self.createUI();
                    self.cleanSidebar();
                    try {
                        const cached = sessionStorage.getItem(
                            'pi-brain-heading-index'
                        );
    
                        if (cached) {
                            self.index = JSON.parse(cached);
                        }
                    } catch (error) {
                        console.warn(
                            'Unable to load heading index:',
                            error
                        );
                    }
                    if (self.index.length === 0) {
                        await self.buildIndex();
                    }
                }
            };
        window.piHeadingSearch = headingSearch;
        headingSearch.init();
        })();

    </script>
