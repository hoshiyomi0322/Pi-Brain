    <script>
        // MathJax configuration
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                processEscapes: true,
                macros: {
                    oiint: ['\\unicode{x222F}'],
                    oiiint: ['\\unicode{x2230}']
                }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                enableMenu: false
            },
            
            <!-- SVG output configuration -->
            svg: {
                fontCache: 'global',

                    'g[data-mml-node="a"] path': {
                        'fill': '#60a5fa !important',

                    },
                    'g[data-mml-node="a"]:hover path': {

                    }

<body>
    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name: 'Pi-Brain',
            homepage: 'index.md',
            auto2top: true,
            maxLevel: 1,
            relativePath: true,
            
            // LaTeX configuration for Docsify
            latex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']],
                customOptions: {
                    throwOnError: false,
                }
            },
            
            plugins: [
                function(hook, vm) {
                    hook.beforeEach(function(content) {
                        content = content.replace(
                            /^(\s*(?:[-*+]\s+|\d+\.\s+)?#{1,6}\s+)(.*?)(?:\s+)?(?:\{:\s*#([A-Za-z][A-Za-z0-9_-]*)\}|\{#([A-Za-z][A-Za-z0-9_-]*)\})\s*$/gm,
                            function(match, prefix, title, id1, id2) {
                                var id = id1 || id2;
                                return (
                                    prefix +
                                    '<span class="pb-custom-anchor" data-pb-id="' +
                                    id +
                                    '"></span>' +
                                    title
                                );
                            }
                        );

                        content = content.replace(
                            /^(\s*)([-*+]\s+|\d+\.\s+)?<h([1-6])\s+id="([^"]+)">([\s\S]*?)<\/h\3>\s*$/gm,
                            function(match, indent, listPrefix, level, id, title) {
                                return (
                                    indent +
                                    (listPrefix || '') +
                                    new Array(parseInt(level, 10) + 1).join('#') +
                                    ' <span class="pb-custom-anchor" data-pb-id="' +
                                    id +
                                    '"></span>' +
                                    title
                                );
                            }
                        );
                        return content;
                    });
                    
                    hook.afterEach(function(html) {
                        var container = document.createElement('div');
                        container.innerHTML = html;
                        var markers = container.querySelectorAll(
                            '.pb-custom-anchor[data-pb-id]'
                        );
                        markers.forEach(function(marker) {
                            var id = marker.getAttribute('data-pb-id');
                            var heading = marker.closest(
                                'h1, h2, h3, h4, h5, h6'
                            );
                            if (!heading) {
                                return;
                            }
                            heading.id = id;
                            var anchor = heading.querySelector('a.anchor');
                            if (anchor) {
                                anchor.setAttribute('data-id', id);
                                var href = anchor.getAttribute('href');
                                if (href) {
                                    var baseHref = href.split('?')[0];
                                    anchor.setAttribute(
                                        'href',
                                        baseHref + '?id=' +
                                        encodeURIComponent(id)
                                    );
                                }
                            }
                            marker.remove();
                        });
                        return container.innerHTML;
                    });

                    hook.doneEach(function() {
                        var markers = document.querySelectorAll(
                            '#main .pb-custom-anchor'
                        );
                        for (var i = 0; i < markers.length; i++) {
                            var marker = markers[i];
                            var id = marker.getAttribute('data-pb-id');
                            var heading = marker.parentNode;
                            while (
                                heading &&
                                heading !== document.body &&
                                !/^H[1-6]$/.test(heading.tagName)
                            ) {
                                heading = heading.parentNode;
                            }
                            if (heading && id) {
                                heading.id = id;
                                marker.parentNode.removeChild(marker);
                            }
                        }
                        
                        // Set the document title based on the current file
                        var name = '';
                        if (vm.route.file) {
                            var rawName = vm.route.file.split('/').pop().replace('.md', '');
                            var spacedName = rawName.replace(/-/g, ' ');
                        
                            name = spacedName.replace(/\b\w/g, function(char) {
                                return char.toUpperCase();
                            });
                            document.title = 'Pi-Brain：' + name;
                        }
                    
                        // Update the sidebar name subtitle based on the current file
                        var appNameContainer = document.querySelector('.app-name');
                        if (appNameContainer) {                       
                            var oldSubTitle = document.querySelector('.app-name-subtitle');
                            if (oldSubTitle) {
                                oldSubTitle.remove();
                            }
                            // Only add the subtitle if the current file is not index.md or readme.md
                            var currentFile = vm.route.file.toLowerCase();
                            if (name && currentFile !== 'index.md' && currentFile !== 'readme.md') {
                                var subTitleElement = document.createElement('div');
                                subTitleElement.className = 'app-name-subtitle';
                                subTitleElement.style.fontSize = '0.70em';
                                subTitleElement.style.fontWeight = 'normal';
                                subTitleElement.style.color = 'rgba(255, 255, 255, 0.5)';
                                subTitleElement.style.marginTop = '1px';
                                subTitleElement.style.textTransform = 'none';
                                subTitleElement.textContent = name;
                                appNameContainer.appendChild(subTitleElement);
                            }
                        }
                    
                        // Adjust image paths to be relative to the current file's directory
                        var images = document.querySelectorAll('#main img');
                        images.forEach(function(img) {
                            var src = img.getAttribute('src');
                            if (src && !/^(http|https|\/)/.test(src)) {
                                var currentFile = vm.route.file; 
                                if (currentFile) {
                                    var folder = currentFile.substring(0, currentFile.lastIndexOf('/'));
                                    if (folder) {
                                        img.setAttribute('src', folder + '/' + src);
                                    }
                                }
                            }
                        });
                    
                        // Adjust links to other markdown files to be relative to the current file's directory
                        var currentFile = vm.route.file;
                        if (currentFile) {
                            var links = document.querySelectorAll('#main a[href*=".md"]');
                            var folder = currentFile.substring(0, currentFile.lastIndexOf('/'));
                        
                            links.forEach(function(a) {
                                var href = a.getAttribute('href');
                                if (/^(http|https|\/#\/|\/)/.test(href)) return;
                                var parts = href.split('#');
                                var relativePath = parts[0];
                                var anchor = parts[1];
                                var targetPath = (folder ? folder + '/' : '') + relativePath;
                                var pathSegments = targetPath.split('/');
                                var resolvedSegments = [];
                                for (var i = 0; i < pathSegments.length; i++) {
                                    var segment = pathSegments[i];
                                    if (segment === '..') {
                                        resolvedSegments.pop();
                                    } else if (segment !== '.' && segment !== '') {
                                        resolvedSegments.push(segment);
                                    }
                                }
                                var finalPath = resolvedSegments.join('/').replace(/\.md$/, '');
                                var newHref = '#/' + finalPath;
                                if (anchor) {
                                    newHref += '?id=' + anchor;
                                }
                                a.setAttribute('href', newHref);
                            });
                        }
                        
                        document.querySelectorAll('.markdown-section table').forEach(function(table) {
                            if (table.parentElement &&
                                table.parentElement.classList.contains('pi-table-scroll')) {
                                return;
                            }
                            var wrapper = document.createElement('div');
                            wrapper.className = 'pi-table-scroll';
                            table.parentNode.insertBefore(wrapper, table);
                            wrapper.appendChild(table);
                        });

                        document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section li').forEach(function(heading) {                        
                            var links = Array.from(
                                heading.querySelectorAll(':scope > a')
                            );
                            for (var i = 1; i < links.length; i++) {
                                var previousLink = links[i - 1];
                                var currentLink = links[i];
                                if (
                                    previousLink.nextSibling &&
                                    previousLink.nextSibling.nodeType === Node.TEXT_NODE &&
                                    previousLink.nextSibling.textContent !== ''
                                ) {
                                    continue;
                                }
                                var previousText = previousLink.textContent || '';
                                if (previousText.trimEnd().endsWith('(')) {
                                    continue;
                                }
                                heading.insertBefore(
                                    document.createTextNode(' '),
                                    currentLink
                                );
                            }
                        });

                        setTimeout(function () {
                            if (
                                window.piHeadingSearch &&
                                typeof window.piHeadingSearch.cleanSidebar === 'function'
                            ) {
                                window.piHeadingSearch.cleanSidebar();
                            }
                        }, 0);
                    
                        if (window.piHeadingSearch) window.piHeadingSearch.scrollToTarget();
                    });
                }
            ]
        }

        function scrollToCustomAnchor() {
            var hash = window.location.hash || '';
            var queryIndex = hash.indexOf('?');
            if (queryIndex === -1) {
                return;
            }
            var queryString = hash.substring(queryIndex + 1);
            var params = new URLSearchParams(queryString);
            var id = params.get('id');
            if (!id) {
                return;
            }
            var target = document.getElementById(id);
            if (!target) {
                return;
            }
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    target.scrollIntoView({
                        behavior: 'auto',
                        block: 'start'
                    });
                });
            });
        }
    </script>
    <script>
        // Heading search functionality
        (function () {
            const headingSearch = {
                index: [],
                initialized: false,
                loading: false,
                target: null,
                createUI: function () {
                    if (document.querySelector('.pi-heading-search')) {
                        return;
                    }
                
                    const sidebar = document.querySelector('.sidebar');
                
                    if (!sidebar) {
                        console.warn(
                            'Pi-Brain heading search: sidebar not found.'
                        );
                        return;
                    }
                
                    const container = document.createElement('div');
                
                    container.className = 'pi-heading-search';
                
                    container.innerHTML = `
                        <div class="pi-heading-search-title">
                            ☄️ Search
                        </div>
                    
                        <div class="pi-heading-search-input-wrapper">
                            <input
                                type="text"
                                class="pi-heading-search-input"
                                placeholder="Type to search..."
                                autocomplete="off"
                                spellcheck="false"
                            >
                        
                            <button
                                type="button"
                                class="pi-heading-search-clear"
                                aria-label="Clear search"
                            >×</button>
                        </div>
                    
                        <div class="pi-heading-search-results"></div>
                    `;
        
                    sidebar.appendChild(container);
                    container.addEventListener('touchstart', function (event) {
                        event.stopPropagation();
                    }, { passive: true });
                    container.addEventListener('touchend', function (event) {
                        event.stopPropagation();
                    }, { passive: true });
                    container.addEventListener('click', function (event) {
                        event.stopPropagation();
                    });

                    const input = container.querySelector(
                        '.pi-heading-search-input'
                    );
                    const clearButton = container.querySelector(
                        '.pi-heading-search-clear'
                    );
                    const inputWrapper = container.querySelector(
                        '.pi-heading-search-input-wrapper'
                    );
                    const resultsContainer = container.querySelector(
                        '.pi-heading-search-results'
                    );
                    [inputWrapper, resultsContainer].forEach(function (element) {
                        if (!element) {
                            return;
                        }
                        element.addEventListener('touchstart', function (event) {
                            event.stopPropagation();
                        }, { passive: true });
                        element.addEventListener('touchend', function (event) {
                            event.stopPropagation();
                        }, { passive: true });
                        element.addEventListener('click', function (event) {
                            event.stopPropagation();
                        });
                    });
                    input.addEventListener('touchstart', function (event) {
                        event.stopPropagation();
                    }, { passive: true });
                    input.addEventListener('touchend', function (event) {
                        event.stopPropagation();
                    }, { passive: true });
                    input.addEventListener('click', function (event) {
                        event.stopPropagation();
                    });
                    input.addEventListener('input', function () {
                        headingSearch.search(this.value);
                    });
        
                    clearButton.addEventListener('click', function () {
                        input.value = '';
        
                        headingSearch.search('');
        
                        input.focus();
                    });
        
                    input.addEventListener('keydown', function (event) {
                        if (event.key === 'Escape') {
                            input.value = '';
        
                            headingSearch.search('');
        
                            input.blur();
                        }
                    });
        
                    this.initialized = true;
                },
                
                buildIndex: async function () {
                    if (this.loading) return;
                    this.loading = true;
                    try {
                        const response = await fetch('./web/search-index.json', { cache: 'no-cache' });
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        const items = await response.json();
                    
                        const docs = new Map();
                        Array.from(new Set(items.map(function (i) { return i.file; }))).forEach(function (file) {
                            const rawName = file.split('/').pop().replace(/\.md$/i, '');
                            const name = rawName
                                .replace(/-/g, ' ')
                                .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
                            docs.set(file.toLowerCase(), {
                                file: file,
                                title: name,
                                displayTitle: name,
                                level: 0,
                                linkFile: file,
                                linkAnchor: '',
                                searchText: (name + ' ' + rawName).toLowerCase()
                            });
                        });
                    
                        const FULL_LINK = /^\[([^\]]+)\]\(\s*([^)\s]+)(?:\s+"[^"]*")?\s*\)$/;
                        const headings = [];
                    
                        items.forEach(function (item) {
                            if (!(item.level > 0)) return;
                        
                            const displayTitle = headingSearch.cleanHeadingText(item.title);
                            if (!displayTitle) return;
                        
                            const entry = {
                                file: item.file,
                                title: item.title,
                                displayTitle: displayTitle,
                                level: item.level,
                                linkFile: '',
                                linkAnchor: '',
                                searchText: displayTitle.toLowerCase()
                            };
                        
                            const full = item.title.match(FULL_LINK);
                            if (full) {
                                const target = headingSearch.resolveLink(item.file, full[2]);
                                const doc = target && docs.get(target.file.toLowerCase());
                                if (doc) {
                                    if (!target.anchor) {
                                        if (doc.searchText.indexOf(entry.searchText) === -1) {
                                            doc.searchText += ' ' + entry.searchText;
                                        }
                                        return;
                                    }
                                    entry.linkFile = doc.file;
                                    entry.linkAnchor = target.anchor;
                                }
                            } else if (item.level === 1) {
                                const self = docs.get(item.file.toLowerCase());
                                if (self && self.displayTitle.toLowerCase() === displayTitle.toLowerCase()) {
                                    return;
                                }
                            }
                        
                            headings.push(entry);
                        });
                    
                        this.index = Array.from(docs.values()).concat(headings);
                    } catch (error) {
                        console.warn('Pi-Brain heading search: unable to load index', error);
                    }
                    this.loading = false;
                },
                
                resolveLink: function (fromFile, href) {
                    if (!href || /^(https?:|mailto:|#|\/)/i.test(href)) return null;
                    const parts = href.split('#');
                    let rel = parts[0];
                    const anchor = parts[1] || '';
                    try { rel = decodeURI(rel); } catch (e) {}
                    if (!/\.md$/i.test(rel)) return null;
                                
                    const folder = fromFile.indexOf('/') === -1
                        ? ''
                        : fromFile.substring(0, fromFile.lastIndexOf('/'));
                    const segments = ((folder ? folder + '/' : '') + rel).split('/');
                    const resolved = [];
                    segments.forEach(function (s) {
                        if (s === '..') resolved.pop();
                        else if (s !== '.' && s !== '') resolved.push(s);
                    });
                    return { file: resolved.join('/'), anchor: anchor };
                },

                cleanHeadingText: function (text) {
                    let result = String(text);
                    result = result.replace(
                        /\[([^\]]+)\]\([^)]+\)/g,
                        '$1'
                    );
                    result = result.replace(
                        /\(\s*\$[\s\S]*?\$\s*\)/g,
                        ''
                    );
                    result = result.replace(
                        /\$\$[\s\S]*?\$\$/g,
                        ''
                    );
                    result = result.replace(
                        /\$[^$\r\n]*\$/g,
                        ''
                    );
                    result = result.split(/[：:]/)[0];
                    result = result.replace(
                        /<[^>]*>/g,
                        ''
                    );
                    result = result
                        .replace(/\*\*(.*?)\*\*/g, '$1')
                        .replace(/__(.*?)__/g, '$1')
                        .replace(/\*(.*?)\*/g, '$1')
                        .replace(/_(.*?)_/g, '$1')
                        .replace(/`(.*?)`/g, '$1');
                    result = result.replace(
                        /\(\s*\)/g,
                        ''
                    );
                    return result
                        .replace(/\s+/g, ' ')
                        .trim();
                },
                cleanSidebar: function () {
                    document
                        .querySelectorAll('.sidebar-nav li a')
                        .forEach(function (link) {
                            const originalText = link.textContent;
                            const cleanedText =
                                headingSearch.cleanHeadingText(
                                    originalText
                                );
                            if (cleanedText !== originalText) {
                                link.textContent = cleanedText;
                            }
                        });
                },

                search: function (keyword) {
                    const resultsContainer =
                        document.querySelector(
                            '.pi-heading-search-results'
                        );
        
                    if (!resultsContainer) {
                        return;
                    }
        
                    keyword = keyword.trim().toLowerCase();
        
                    if (!keyword) {
                        resultsContainer.innerHTML = '';
                        return;
                    }
        
                    const results = this.index.filter(
                        function (item) {
                            return item.searchText.includes(keyword);
                        }
                    );
                    const visibleResults = results.slice(0, 100);
        
                    if (visibleResults.length === 0) {
                        resultsContainer.innerHTML = `
                            <div class="pi-heading-search-empty">
                                No results found
                            </div>
                        `;
        
                        return;
                    }
                    resultsContainer.innerHTML =
                        visibleResults.map(function (item) {
                            const fileName = item.file.replace(/\.md$/i, '');
                            return `
                                <a href="#"
                                        class="pi-heading-search-result level-${item.level}"
                                        data-file="${headingSearch.escapeAttribute(item.file)}"
                                        data-title="${headingSearch.escapeAttribute(item.title)}"
                                        data-link-file="${headingSearch.escapeAttribute(item.linkFile || '')}"
                                        data-link-anchor="${headingSearch.escapeAttribute(item.linkAnchor || '')}"
                                    >
                                        <span class="pi-heading-result-text">
                                            ${headingSearch.escapeHTML(item.displayTitle)}
                                        </span>
                                        <span class="pi-heading-file">
                                            ${headingSearch.escapeHTML(fileName)}
                                        </span>
                                    </a>
                                `;
                            
                        }).join('');
                    resultsContainer
                        .querySelectorAll(
                            '.pi-heading-search-result'
                        )
                        .forEach(function (link) {
                            link.addEventListener(
                                'click',
                                function (event) {
                                    event.preventDefault();
        
                                    const file = this.dataset.file;
                                    const title = this.dataset.title;

                                    const linkFile = this.dataset.linkFile;
                                    if (linkFile) {
                                        headingSearch.target = null;
                                        window.location.hash =
                                            '#/' + linkFile.replace(/\.md$/i, '') +
                                            (this.dataset.linkAnchor
                                                ? '?id=' + encodeURIComponent(this.dataset.linkAnchor)
                                                : '');
                                        return;
                                    }

                                    headingSearch.target = {
                                        file: file,
                                        title: title
                                    };

                                    const route = file.replace(
                                        /\.md$/i,
                                        ''
                                    );

                                    const displayTitle =
                                        headingSearch.cleanHeadingText(title);

                                    const headingId =
                                        headingSearch.createHeadingId(
                                            displayTitle
                                        );

                                    window.location.hash =
                                        '#/' +
                                        route +
                                        '?id=' +
                                        encodeURIComponent(
                                            headingId
                                        );
                                }
                            );
                        });
                        if (
                            window.MathJax &&
                            typeof window.MathJax.typesetPromise === 'function'
                        ) {
                            window.MathJax.typesetPromise([
                                resultsContainer
                            ]).catch(function (error) {
                                console.warn(
                                    'Pi-Brain heading search MathJax:',
                                    error
                                );
                            });
                        }
                },          
                
                scrollToTarget: function () {
                    if (!this.target) {
                        return;
                    }
                    const target = this.target;
                    let attempts = 0;
                    function findHeading() {
                        const headings = document.querySelectorAll(
                            '#main h1, #main h2, #main h3'
                        );
                        let found = null;
                        headings.forEach(function (heading) {
                            if (found) {
                                return;
                            }
                            const title =
                                headingSearch.cleanHeadingText(
                                    heading.textContent
                                );
                            if (
                                title === headingSearch.cleanHeadingText(
                                    target.title
                                )
                            ) {
                                found = heading;
                            }
                        });
                        if (found) {
                            found.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                            found.classList.add(
                                'pi-heading-search-highlight'
                            );
                            setTimeout(function () {
                                found.classList.remove(
                                    'pi-heading-search-highlight'
                                );
                            
                            }, 1500);
                            headingSearch.target = null;
                            return;
                        }
                        attempts++;
                        if (attempts < 20) {
                            setTimeout(
                                findHeading,
                                100
                            );
                        } else {
                            headingSearch.target = null;
                        }
                    }
                    findHeading();
                },

                createHeadingId: function (title) {
                    return String(title)
                        .trim()
                        .toLowerCase()
                        .replace(
                            /[^\w\u00C0-\uFFFF\s-]/g,
                            ''
                        )
                        .replace(/\s+/g, '-')
                        .replace(/-+/g, '-');
                },

                escapeHTML: function (value) {
                    return String(value)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                },
        
                escapeAttribute: function (value) {
                    return this.escapeHTML(value);
                },
            
                init: async function () {
                    const self = this;
                    function waitForSidebar() {
                        return new Promise(function (resolve) {
                            const existingSidebar =
                                document.querySelector('.sidebar');
    
                            if (existingSidebar) {
                                resolve();
                                return;
                            }
                            const observer =
                                new MutationObserver(function () {
                                    const sidebar =
                                        document.querySelector('.sidebar');
    
                                    if (sidebar) {
                                        observer.disconnect();
                                        resolve();
                                    }
                                });
    
                            observer.observe(
                                document.body,
                                {
                                    childList: true,
                                    subtree: true
                                }
                            );
                        });
                    }
                    await waitForSidebar();
                    self.createUI();
                    self.cleanSidebar();
                    if (self.index.length === 0) {
                        await self.buildIndex();
                    }
                }
            };
        window.piHeadingSearch = headingSearch;
        headingSearch.init();
        })();

    </script>
